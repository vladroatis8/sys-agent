services:
  ollama:
    image: ollama/ollama:latest
    container_name: aso_ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile.mcp
    container_name: aso_mcp
    volumes:
      - ./admin_folder:/app/admin_folder:ro
    ports:
      - "7000:7000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=7000
      - MCP_TRANSPORT=http
      - MCP_API_KEY=fcsb#1
    depends_on:
      - ollama

  adk-web:
    build:
      context: .
      dockerfile: Dockerfile.adk
    container_name: aso_adk_web
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - MCP_HTTP_URL=http://mcp-server:7000/mcp
      - MCP_API_KEY=fcsb#1
      - MCP_HTTP_URL=http://mcp-server:7000/mcp
      - PYTHONPATH=/app
    depends_on:
      - mcp-server
      - ollama

volumes:
  ollama_models: