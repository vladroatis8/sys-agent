version: "3.9"

services:
  # 1) OLLAMA + model
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: aso_ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # 2) MCP server
  mcp-server:
    build:
      context: ./mcp_server      
      dockerfile: Dockerfile.mcp
    container_name: aso_mcp
    depends_on:
      - ollama
    ports:
      - "7000:7000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=7000
      - MCP_TRANSPORT=http
      - MCP_API_KEY=fcsb#1
    volumes:
      
      - ./admin_folder:/app/admin_folder
    restart: unless-stopped

  # 3) ADK Web + agent
  adk-web:
    build:
      context: .
      dockerfile: Dockerfile.adk
    container_name: aso_adk_web
    depends_on:
      - mcp-server
      - ollama
    ports:
      - "8000:8000"
    environment:
      
      MCP_SERVER_URL: "http://mcp-server:7000/mcp"
      OLLAMA_API_BASE: "http://ollama:11434"
      MCP_API_KEY: "fcsb#1"
    restart: unless-stopped

volumes:
  ollama_models: